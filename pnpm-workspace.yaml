# Allow build scripts for trusted dependencies
# - https://pnpm.io/settings#allowbuilds
allowBuilds:
  unrs-resolver: false

# Block transitive dependencies from using git repositories or
# direct tarball URLs
# - https://pnpm.io/settings#blockexoticsubdeps
blockExoticSubdeps: true

# Prevents installation of packages newer than 7 days
# to mitigate supply chain security risks
# - https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@upleveled/*'
  - eslint-config-upleveled
  - eslint-plugin-upleveled
  - stylelint-config-upleveled
  # - https://github.com/advisories/GHSA-7h2j-956f-4vf2
  - '@isaacs/brace-expansion@5.0.1'
  # Renovate security update: yaml@2.8.3
  - yaml@2.8.3

patchedDependencies:
  # Add missing `meta` and `rules` to bundled default export types, causing TS2559 with FlatConfig.Plugin
  # - https://github.com/es-tooling/eslint-plugin-jsx-a11y-x/pull/106
  eslint-plugin-jsx-a11y-x@0.2.0: patches/eslint-plugin-jsx-a11y-x@0.2.0.patch

# Prevent trust level decreases with new versions of dependencies
# - https://pnpm.io/settings#trustpolicy
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  # first version with provenance: semver@7.5.1
  - semver@6.3.1
